# Analysis parameters. Paths go in config/paths.yaml (not committed).
seed: 20261102

# Stage 2 QC (fixed before the first QC run; see docs/analysis_plan.md, section 3)
qc:
  min_genes: 200              # cells below are flagged low_genes
  max_pct_mt_nuclei: 5        # snRNA-seq (nuclei)
  max_pct_mt_cells: 20        # whole-cell data (Smart-seq2 somata)
  scrublet_expected_rate: 0.06
  scrublet_min_cells_per_sample: 500   # scrublet is skipped on smaller samples
  # datasets whose authors already filtered and annotated the cells keep every
  # annotated cell; the flags are recorded but not applied
  keep_author_cells:
    - bhuiyan2025_hdrg
    - heming2025_sural_snrna
    - jung2023_hdrg
    - yang2022_htg
    - yang2025_hsg_multiome
    - yu2024_singlesoma   # added after the first QC run; see analysis log 2.4
  whole_cell:
    - yu2024_singlesoma
  no_doublet_call:              # non-droplet protocols
    - yu2024_singlesoma

# Stage 2 merge and integration (fixed before the first integration run;
# docs/analysis_plan.md, section 3 and amendment 1)
integration:
  genes: intersection           # genes present in every dataset
  # author labels that do not follow the expression of the cells they are
  # attached to (results/reference/label_alignment.tsv; analysis log 2.5);
  # these datasets enter unlabelled and get their states by label transfer
  labels_unusable: [yang2025_hsg_multiome]
  # painseq atlas cells that duplicate datasets read separately here
  exclude_painseq_sources: [Jung_2023, Nguyen_2021, Tavares-Ferriera_2022]
  n_hvg: 3000                   # seurat_v3 on counts, balanced across datasets
  hvg_batch_key: dataset
  batch_key: batch              # dataset:donor, or dataset:library where the donor is unknown
  study_key: dataset
  label_key: state              # scANVI seed labels; "unassigned" and unlabelled cells are unknown
  n_latent: 30
  n_layers: 2
  n_hidden: 128
  gene_likelihood: nb
  batch_size: 256
  scvi_max_epochs: 30
  scanvi_max_epochs: 20
  scanvi_n_samples_per_label: 100
  n_pcs: 50
  harmony_vars: [batch, dataset]
  eval_max_cells: 50000         # cells per subset for the scIB metrics
  rule_margin: 0.05             # plan section 3
  # tissue, compartment and protocol per dataset
  datasets:
    bhuiyan2025_hdrg: {tissue: DRG, compartment: ganglion, protocol: 10x nuclei}
    jung2023_hdrg: {tissue: DRG, compartment: ganglion, protocol: 10x nuclei}
    nguyen2021_hdrg: {tissue: DRG, compartment: ganglion, protocol: 10x nuclei}
    zhang_hdrg_glia: {tissue: DRG, compartment: ganglion, protocol: 10x nuclei}
    yu2024_singlesoma: {tissue: DRG, compartment: ganglion, protocol: Smart-seq2 somata}
    yang2022_htg: {tissue: trigeminal ganglion, compartment: ganglion, protocol: 10x nuclei}
    yang2025_hsg_multiome: {tissue: sympathetic ganglion, compartment: ganglion, protocol: 10x multiome nuclei}
    heming2025_sural_snrna: {tissue: sural nerve, compartment: nerve, protocol: 10x nuclei}

# Stage 2 label transfer (fixed before the run; plan section 3 for the state rule)
transfer:
  embedding: X_scanvi           # the embedding chosen in 2.5
  k: 15                         # nearest reference cells, within compartment and author class
  min_conf: 0.5                 # neighbour fraction below which a cell is "<class> unassigned"
  n_folds: 5                    # held-out batches for the reliability check
  sympathetic_tissue: sympathetic ganglion
  sympathetic_state: sympathetic neuron   # neurons of that tissue; the reference has no sympathetic seed
  sympathetic_markers: [TH, DBH, PRPH]    # tabulated as the check, not used to assign
  state_min_cells: 50
  state_min_donors: 3
