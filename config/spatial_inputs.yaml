  technology: Visium
  tissue: DRG
  compartment: ganglion
  # donors, batches (Space Ranger 1.1.0 / 1.3.0 / 2.0.0) from the GEO docx;
  # conditions from the paper (PMID 40325011): donors 1, 2, 3, 4 and 6
  # diabetic with peripheral neuropathy, donor 14 diabetic taking
  # analgesics, no non-diabetic donor. M2-1 and M2-2 are the same files as
  # Tavares-Ferreira VM2-1 and VM2-2 (donor 14 is their donor M2); the
