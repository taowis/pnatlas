  format: visium_h5
  technology: Visium
  tissue: DRG
  compartment: ganglion
  condition: control
  # Space Ranger H5 per section, two sections per donor, no positions (the
  # combined Seurat object holds only the 3,952 neuron-rich barcodes and no
  # images). Donors and ages from README_sampleIDs.xlsx; batch = sequencing
  # run. VM2-1 and VM2-2 (donor M2, male 53, diabetic by the Shiers 2025
  # paper) are read once, as Shiers M2-1 and M2-2, where positions exist.
  sections:
    VF1-1: {h5: raw/tavaresferreira2022_hdrg_visium/VF1-1_filtered_feature_bc_matrix.h5, donor: TF-F1, batch: tf_run1}   # female 44
    VF1-2: {h5: raw/tavaresferreira2022_hdrg_visium/VF1-2_filtered_feature_bc_matrix.h5, donor: TF-F1, batch: tf_run1}   # female 44
    VM1-1: {h5: raw/tavaresferreira2022_hdrg_visium/VM1-1_filtered_feature_bc_matrix.h5, donor: TF-M1, batch: tf_run1}   # male 29
    VM1-2: {h5: raw/tavaresferreira2022_hdrg_visium/VM1-2_filtered_feature_bc_matrix.h5, donor: TF-M1, batch: tf_run1}   # male 29
    VF2-1: {h5: raw/tavaresferreira2022_hdrg_visium/VF2-1_filtered_feature_bc_matrix.h5, donor: TF-F2, batch: tf_run1}   # female 57
    VF2-2: {h5: raw/tavaresferreira2022_hdrg_visium/VF2-2_filtered_feature_bc_matrix.h5, donor: TF-F2, batch: tf_run1}   # female 57
    VF3-1: {h5: raw/tavaresferreira2022_hdrg_visium/VF3-1_filtered_feature_bc_matrix.h5, donor: TF-F3, batch: tf_run2}   # female 34
    VF3-2: {h5: raw/tavaresferreira2022_hdrg_visium/VF3-2_filtered_feature_bc_matrix.h5, donor: TF-F3, batch: tf_run2}   # female 34
    VM3-1: {h5: raw/tavaresferreira2022_hdrg_visium/VM3-1_filtered_feature_bc_matrix.h5, donor: TF-M3, batch: tf_run2}   # male 65
    VM3-2: {h5: raw/tavaresferreira2022_hdrg_visium/VM3-2_filtered_feature_bc_matrix.h5, donor: TF-M3, batch: tf_run2}   # male 65
    VF4-1: {h5: raw/tavaresferreira2022_hdrg_visium/VF4-1_filtered_feature_bc_matrix.h5, donor: TF-F4, batch: tf_run2}   # female 53
    VF4-2: {h5: raw/tavaresferreira2022_hdrg_visium/VF4-2_filtered_feature_bc_matrix.h5, donor: TF-F4, batch: tf_run2}   # female 53
    VM4-1: {h5: raw/tavaresferreira2022_hdrg_visium/VM4-1_filtered_feature_bc_matrix.h5, donor: TF-M4, batch: tf_run2}   # male 24
    VM4-2: {h5: raw/tavaresferreira2022_hdrg_visium/VM4-2_filtered_feature_bc_matrix.h5, donor: TF-M4, batch: tf_run2}   # male 24

utdallas_dpn_nerves:
  format: seurat_export
  technology: Visium
  tissue: sural nerve
  compartment: nerve
  dir: interim/rds/utdallas_dpn_nerves
  # anatomy check: the low-resolution tissue image kept in the Seurat object
  # (exported by rds_spatial_to_mtx.R), scale factor from the exported coordinates
  anatomy: {kind: seurat_export, image: "interim/rds/utdallas_dpn_nerves/images/{image}.png", coordinates: interim/rds/utdallas_dpn_nerves/coordinates.csv.gz, scale_column: lowres, marker_px: 5}
  # the authors' annotated object (six images, full-resolution pixel
  # coordinates, CellType labels); donors, diabetes and the axonal loss
  # grade from sample_metadata.csv (sample 24 is the control, with two
  # sections, 24l and 24t)
  sections:
    sural8: {id: sural8, donor: dpn8, condition: DPN, batch: dpn8}        # male 75, type II, moderate axonal loss
    sural11: {id: sural11, donor: dpn11, condition: DPN, batch: dpn11}    # male 80, type II, severe axonal loss
    sural12: {id: sural12, donor: dpn12, condition: DPN, batch: dpn12}    # male 61, type II, severe axonal loss
    sural14: {id: sural14, donor: dpn14, condition: DPN, batch: dpn14}    # male 50, type II, severe axonal loss
    sural24l: {id: sural24l, donor: dpn24, condition: control, batch: dpn24}   # male 58, non-diabetic, normal axonal density
    sural24t: {id: sural24t, donor: dpn24, condition: control, batch: dpn24}
