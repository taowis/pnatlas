# How each spatial dataset is read into one AnnData per section
# (workflow/scripts/build_spatial.py). Paths are relative to data_root.
# Donors, conditions and batches come from the GEO sample sheets
# (data/metadata/geo_samples_spatial.tsv), the authors' sample sheets on
# Box and the Shiers 2025 metadata docx; the analysis log (3.3) says where
# each value was read.

heming2025_sural_xenium:
  format: xenium
  technology: Xenium
  tissue: sural nerve
  compartment: nerve
  # one donor per section; condition from the GEO "disease" field
  # (CIDP, CIAP, vasculitic neuropathy VN, control)
  # anatomy check: the DAPI morphology z-stack from the GEO tar (11 planes,
  # 3 microns apart), maximum projection at pyramid level 3 (1.7 microns per
  # pixel); cell centroids are in microns, pixel size from the OME metadata
  anatomy: {kind: ome_tiff, image: "raw/heming2025_sural_xenium/extracted/*_{section}_morphology.ome.tif", level: 3, marker_px: 3}
  sections:
    S01: {h5: raw/heming2025_sural_xenium/extracted/GSM8714492_S01_cell_feature_matrix.h5, cells: raw/heming2025_sural_xenium/extracted/GSM8714492_S01_cells.parquet, donor: S01, condition: CIDP, batch: Münster}
    S04: {h5: raw/heming2025_sural_xenium/extracted/GSM8714493_S04_cell_feature_matrix.h5, cells: raw/heming2025_sural_xenium/extracted/GSM8714493_S04_cells.parquet, donor: S04, condition: CIAP, batch: Münster}
    S11: {h5: raw/heming2025_sural_xenium/extracted/GSM8714494_S11_cell_feature_matrix.h5, cells: raw/heming2025_sural_xenium/extracted/GSM8714494_S11_cells.parquet, donor: S11, condition: CIDP, batch: Essen}
    S14: {h5: raw/heming2025_sural_xenium/extracted/GSM8714495_S14_cell_feature_matrix.h5, cells: raw/heming2025_sural_xenium/extracted/GSM8714495_S14_cells.parquet, donor: S14, condition: CIAP, batch: Essen}
    S22: {h5: raw/heming2025_sural_xenium/extracted/GSM8714496_S22_cell_feature_matrix.h5, cells: raw/heming2025_sural_xenium/extracted/GSM8714496_S22_cells.parquet, donor: S22, condition: control, batch: Essen}
    S24: {h5: raw/heming2025_sural_xenium/extracted/GSM8714497_S24_cell_feature_matrix.h5, cells: raw/heming2025_sural_xenium/extracted/GSM8714497_S24_cells.parquet, donor: S24, condition: control, batch: Essen}
    S29: {h5: raw/heming2025_sural_xenium/extracted/GSM8714498_S29_cell_feature_matrix.h5, cells: raw/heming2025_sural_xenium/extracted/GSM8714498_S29_cells.parquet, donor: S29, condition: VN, batch: Würzburg}
    S30: {h5: raw/heming2025_sural_xenium/extracted/GSM8714499_S30_cell_feature_matrix.h5, cells: raw/heming2025_sural_xenium/extracted/GSM8714499_S30_cells.parquet, donor: S30, condition: VN, batch: Würzburg}

yu2024_hdrg_xenium:
  format: neuron_csv
  technology: Xenium (100-gene panel, hand-segmented neurons)
  tissue: DRG
  compartment: ganglion
  condition: control
  matrix: raw/yu2024_hdrg_xenium/GSE273557_hDRG_gene_expression_matrix.csv.gz
  metadata: raw/yu2024_hdrg_xenium/GSE273557_hDRG_gene_expression_matrix_metadata.csv.gz
  position_column: cell_id          # "x-y"
  section_column: Xenium_id
  section_pattern: "(Region_\\d)"
  spatial_units: image pixels (from the authors' cell_id)
  # regions from the GEO sample titles: donor 1 (2103-02139, female, 56),
  # donor 2 (2106-05090, male, 23)
  sections:
    Region_1: {donor: 2103-02139, batch: slide0018220, level: L3}
    Region_2: {donor: 2106-05090, batch: slide0018220, level: L3}
    Region_3: {donor: 2106-05090, batch: slide0018220, level: T12}
    Region_4: {donor: 2106-05090, batch: slide0018220, level: T12}

zhang2024_hdrg_visium:
  format: visium_mtx
  technology: Visium
  tissue: DRG
  compartment: ganglion
  condition: control
  # no positions on GEO (the archives hold matrix, features and barcodes only)
  sections:
    DRG2: {dir: raw/zhang2024_hdrg_visium/extracted/GSM7778668_DRG2_filtered_feature_bc_matrix, donor: DRG2}
    DRG3: {dir: raw/zhang2024_hdrg_visium/extracted/GSM7778669_DRG3_filtered_feature_bc_matrix, donor: DRG3}
    DRG4: {dir: raw/zhang2024_hdrg_visium/extracted/GSM7778670_DRG4_filtered_feature_bc_matrix, donor: DRG4}
    DRG5: {dir: raw/zhang2024_hdrg_visium/extracted/GSM7778671_DRG5_filtered_feature_bc_matrix, donor: DRG5}
    DRG6: {dir: raw/zhang2024_hdrg_visium/extracted/GSM7778672_DRG6_filtered_feature_bc_matrix, donor: DRG6}
    DRG7: {dir: raw/zhang2024_hdrg_visium/extracted/GSM7778673_DRG7_filtered_feature_bc_matrix, donor: DRG7}

vroman2023_hdrg_visium:
  format: visium_h5
  technology: Visium
  tissue: DRG
  compartment: ganglion
  condition: control
  # two serial sections of one donor; no positions on GEO (Loupe files only)
  sections:
    DRG2a: {h5: raw/vroman2023_hdrg_visium/extracted/GSM6652504_DRG2a_filtered_feature_bc_matrix.h5, donor: VromanDRG2, batch: VromanDRG2}
    DRG2b: {h5: raw/vroman2023_hdrg_visium/extracted/GSM6652505_DRG2b_filtered_feature_bc_matrix.h5, donor: VromanDRG2, batch: VromanDRG2}

shiers2025_dpn_drg:
