    181030-1L4-3: {h5: raw/shiers2025_dpn_drg/extracted/GSM8943587_sam-UTD-181030DHB-1L4-3_filtered_feature_bc_matrix.h5, positions: raw/shiers2025_dpn_drg/extracted/GSM8943587_tissue_positions_list_Frame3.csv, selections: raw/shiers2025_dpn_drg/extracted/GSM8943587_181030_L4DRG1_VisFrame3_NgnNeuSelections.csv, donor: 181030DHB, batch: shiers2, condition: DPN}
    181030-1L4-7: {h5: raw/shiers2025_dpn_drg/extracted/GSM8943588_sam-UTD-181030DHB-1L4-7_filtered_feature_bc_matrix.h5, positions: raw/shiers2025_dpn_drg/extracted/GSM8943588_tissue_positions_list_Frame7.csv, selections: raw/shiers2025_dpn_drg/extracted/GSM8943588_181030_L4DRG1_VisFrame7_NgnNeuSelections.csv, donor: 181030DHB, batch: shiers2, condition: DPN}
