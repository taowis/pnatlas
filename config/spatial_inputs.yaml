    M2-2: {h5: raw/shiers2025_dpn_drg/extracted/GSM8943584_M2-2_filtered_feature_bc_matrix.h5, positions: raw/shiers2025_dpn_drg/extracted/GSM8943584_tissue_positions_list_s8r1_090d1.csv, selections: raw/shiers2025_dpn_drg/extracted/GSM8943584_sample8.csv, donor: DN0003, batch: shiers1, condition: diabetic}
    180714-L4-1: {h5: raw/shiers2025_dpn_drg/extracted/GSM8943585_sam-UTD-180714DHB-DRGL4-1_filtered_feature_bc_matrix.h5, positions: raw/shiers2025_dpn_drg/extracted/GSM8943585_tissue_positions_list_Frame1.csv, selections: raw/shiers2025_dpn_drg/extracted/GSM8943585_180714_DRGL4_VisFrame1_NgnNeuSelections.csv, donor: 180714DHB, batch: shiers2, condition: DPN}
