name: pnatlas-r
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # R side of the project: only used to read the authors' Seurat and RDS
  # objects and write them out as matrix market plus CSV for the Python side.
  - r-base=4.4
  - r-seurat
  - r-seuratobject
  - r-matrix
  - r-data.table
  - r-hdf5r
  - r-optparse
  # stage 4 deconvolution: BayesPrism and MuSiC are installed from GitHub by
  # workflow/scripts/deconv_install.R on top of these dependencies
  - r-remotes
  - r-nmf
  - r-snowfall
  - r-gplots
  - r-nnls
  - r-mcmcpack
  - r-ggplot2
  - bioconductor-biobase
  - bioconductor-singlecellexperiment
  - bioconductor-scran
  - bioconductor-biocparallel
  - bioconductor-toast
  - r-coloc=5.2.3         # stage 5 colocalisation (coloc.abf, coloc.bf_bf with the SuSiE log Bayes factors)
