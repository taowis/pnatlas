name: pnatlas
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - pip
  # core
  - numpy
  - pandas
  - scipy
  - pyyaml
  - pyarrow
  - h5py
  - matplotlib
  - seaborn
  # single-cell
  - anndata
  - scanpy
  - leidenalg
  - igraph
  - scikit-misc        # loess for seurat_v3 highly variable genes
  - scvi-tools
  - pytorch
  - jax
  - jaxlib
  # workflow
  - snakemake-minimal
  # dev
  - pytest
  - ruff
  - requests
  - pip:
      - harmonypy
      - scib-metrics
      - scrublet
      - cell2location==0.1.5   # spatial mapping (stage 3)
      - pyro-ppl==1.9.0        # cell2location 0.1.5 does not import with pyro 1.9.2
      - openpyxl               # authors' xlsx sample sheets
