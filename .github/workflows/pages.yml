name: pages
# The site is built on every push to main that touches its inputs, as a
# check; it is deployed only from the public repository, where Pages is
# set to "GitHub Actions".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [portal/**, results/**, data/metadata/**, config/datasets.yaml, .github/workflows/pages.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyyaml
      - run: python portal/build_portal.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    if: github.repository == 'taowis/pnatlas'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
